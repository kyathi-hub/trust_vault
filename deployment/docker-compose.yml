version: "3.9"

# TrustVault — Docker Compose
# All internal services are on a private network.
# Only Caddy is exposed to the host (ports 80 and 443).
# Internal services (PostgreSQL, MinIO, Keycloak, backend) are NEVER directly accessible from outside.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  internal:
    driver: bridge
    internal: true   # no external internet access from this network
  proxy:
    driver: bridge   # caddy needs internet access for ACME/TLS

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustvault
      POSTGRES_USER: trustvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./deployment/postgres/init-passwords.sh:/docker-entrypoint-initdb.d/02-init-passwords.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustvault -d trustvault"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    # Non-root user (postgres image uses uid 999 by default)
    user: "999:999"

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    volumes:
      - minio_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    # MinIO console is NOT exposed — admin access via port-forward only

  # ── Keycloak ───────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD required}
      KC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:?KEYCLOAK_ADMIN_USER required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD required}
    volumes:
      - ./deployment/keycloak:/opt/keycloak/data/import:ro
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging: *default-logging

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY required}
      DATABASE_URL: postgresql+asyncpg://trustvault_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD required}@postgres:5432/trustvault
      DATABASE_URL_SYNC: postgresql+psycopg2://trustvault_app:${APP_DB_PASSWORD}@postgres:5432/trustvault
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: trustvault
      KEYCLOAK_CLIENT_ID: trustvault-api
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?MINIO_APP_ACCESS_KEY required}
      MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?MINIO_APP_SECRET_KEY required}
      MINIO_BUCKET: trustvault-documents
      MINIO_SECURE: "false"
      ENCRYPTION_KEK: ${ENCRYPTION_KEK:?ENCRYPTION_KEK required}
      ENCRYPTION_KEK_VERSION: ${ENCRYPTION_KEK_VERSION:-v1}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
      CLAMAV_HOST: clamav
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_URL: http://ollama:11434
      CORS_ALLOWED_ORIGINS: '["https://${PUBLIC_HOSTNAME:-localhost}"]'
      AUDIT_FAIL_CLOSED: "true"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_KEYCLOAK_URL: https://${PUBLIC_HOSTNAME:-localhost}/auth
        VITE_KEYCLOAK_REALM: trustvault
        VITE_KEYCLOAK_CLIENT_ID: trustvault-frontend
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ── Caddy (Reverse Proxy) ──────────────────────────────────────────────────
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Internal ports (postgres:5432, minio:9000, keycloak:8080) are NOT exposed
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
      - proxy
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging: *default-logging

  # ── ClamAV (optional malware scanning) ────────────────────────────────────
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    profiles:
      - clamav   # only starts with: docker compose --profile clamav up
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - internal
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging: *default-logging

  # ── Ollama (optional local AI) ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles:
      - ollama   # only starts with: docker compose --profile ollama up
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal
    logging: *default-logging

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
  clamav_data:
  ollama_data:
