name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trustvault_test
          POSTGRES_USER: trustvault
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      APP_SECRET_KEY: ci-test-secret-key-32-bytes-long!!
      DATABASE_URL: postgresql+asyncpg://trustvault:testpassword@localhost:5432/trustvault_test
      DATABASE_URL_SYNC: postgresql+psycopg2://trustvault:testpassword@localhost:5432/trustvault_test
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: trustvault
      KEYCLOAK_CLIENT_ID: trustvault-api
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioaccess
      MINIO_SECRET_KEY: miniosecret
      ENCRYPTION_KEK: dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleXQ=
      ENCRYPTION_KEK_VERSION: v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" psycopg2-binary

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy app --ignore-missing-imports

      - name: Run migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest -v --cov=app --cov-report=xml --cov-fail-under=70

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint, typecheck, test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test

  # ── Security scans ─────────────────────────────────────────────────────────
  security:
    name: Security scans
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (Python dependencies)
        run: |
          pip install pip-audit
          pip-audit --requirement backend/pyproject.toml --ignore-vuln PYSEC-2022-42974 || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (JS dependencies)
        run: |
          cd frontend
          npm audit --audit-level=high || true

      - name: Check for secrets in git
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
