[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustvault"
version = "0.1.0"
description = "TrustVault — Secure Document Sharing Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "python-jose[cryptography]==3.3.0",
    "httpx==0.28.0",
    "python-multipart==0.0.18",
    "minio==7.2.11",
    "cryptography==44.0.0",
    "python-magic==0.4.27",
    "structlog==24.4.0",
    "tenacity==9.0.0",
    "slowapi==0.1.9",
    "greenlet==3.1.1",
    "psycopg2-binary==2.9.10",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.0",
    "ruff==0.8.3",
    "mypy==1.13.0",
    "factory-boy==3.3.1",
    "testcontainers[postgres]==4.8.2",
    "types-python-jose==3.3.4.20240106",
    "aiosqlite==0.20.0",
    "psycopg2-binary==2.9.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "N"]
ignore = ["S101", "B008"]  # assert in tests is fine; Depends() in defaults

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
